name: Release

# Publishes the public images self-hosters pull:
#   ghcr.io/llmpanel/llmpanel-{api,web}
#
#   push a tag  -> :v1.2.3, :1.2 and :latest
#   push master -> :edge
#
# These must stay public — install.sh pulls them anonymously, and a GHCR package
# defaults to private on its first push. Publish once, then flip both packages
# to public in the organisation's package settings.
#
# The cloud build is a separate image published from the private monorepo;
# nothing here should ever push to that name.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Spelled out rather than built from github.repository_owner: the
          # organisation is "LLMPanel" and GHCR only accepts a lowercase
          # namespace, so an interpolated owner is a coin flip.
          images: ${{ env.REGISTRY }}/llmpanel/llmpanel-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}

      - uses: docker/build-push-action@v6
        with:
          # Both images build from the repo root: they need the pnpm workspace,
          # not just their own app directory.
          context: .
          file: ${{ matrix.dockerfile }}
          # amd64 only. GPU hosts are x86, and cross-building the Next.js and
          # esbuild toolchains under arm64 emulation is slow enough to time out.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=llmpanel-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=llmpanel-${{ matrix.name }}
