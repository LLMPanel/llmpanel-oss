name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — the action reads `packageManager` from package.json,
      # and naming a version as well fails with "Multiple versions of pnpm
      # specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Builds both apps. Catches the Next.js build errors that typecheck alone
      # misses — bad server/client boundaries, and env vars read at build time.
      - run: pnpm build
        env:
          # apps/web/env.ts parses these with Zod at build time and throws if
          # one is missing. They must also be listed under `build.env` in
          # turbo.json — Turborepo filters the environment, so an undeclared
          # variable reaches the build as undefined no matter what is set here.
          HONO_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # The images self-hosters pull are built from this repo, so a Dockerfile that
  # no longer builds has to fail here rather than at release time.
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          # Both images build from the repo root: they need the pnpm workspace,
          # not just their own app directory.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=oss-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=oss-${{ matrix.name }}
